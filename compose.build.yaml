# Build LiteBooks from this checkout instead of pulling the published image.
#
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build
#
# Kept as an override rather than putting `build:` beside `image:` in the base
# file: that combination silently builds locally whenever the image is missing,
# which would hide a broken pull from the update flow.
services:
  web:
    build: .
  updater:
    build: ./docker/updater
