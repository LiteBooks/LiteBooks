name: litebooks

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-litebooks}
      POSTGRES_USER: ${POSTGRES_USER:-litebooks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-litebooks} -d ${POSTGRES_DB:-litebooks}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: ${LITEBOOKS_UPDATE_IMAGE:-ghcr.io/litebooks/litebooks}:${LITEBOOKS_TAG:-main}
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-America/Los_Angeles}
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-false}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-false}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-0}
      DATABASE_URL: postgresql://${POSTGRES_USER:-litebooks}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-litebooks}
      LITEBOOKS_MANAGE_PY: ${LITEBOOKS_MANAGE_PY:-manage.py}
      LITEBOOKS_WAIT_FOR_DB: ${LITEBOOKS_WAIT_FOR_DB:-true}
      LITEBOOKS_AUTO_MIGRATE: ${LITEBOOKS_AUTO_MIGRATE:-true}
      LITEBOOKS_COLLECT_STATIC: ${LITEBOOKS_COLLECT_STATIC:-false}
      LITEBOOKS_HEALTHCHECK_URL: ${LITEBOOKS_HEALTHCHECK_URL:-http://127.0.0.1:8000/healthz/}
      LITEBOOKS_UPDATES_ENABLED: ${LITEBOOKS_UPDATES_ENABLED:-true}
      LITEBOOKS_UPDATE_REPO: ${LITEBOOKS_UPDATE_REPO:-LiteBooks/LiteBooks}
      LITEBOOKS_UPDATE_BRANCH: ${LITEBOOKS_UPDATE_BRANCH:-main}
      LITEBOOKS_UPDATE_IMAGE: ${LITEBOOKS_UPDATE_IMAGE:-ghcr.io/litebooks/litebooks}
      LITEBOOKS_UPDATE_CHECK_INTERVAL: ${LITEBOOKS_UPDATE_CHECK_INTERVAL:-86400}
      LITEBOOKS_UPDATE_STATE_DIR: /state
      LITEBOOKS_GITHUB_TOKEN: ${LITEBOOKS_GITHUB_TOKEN:-}
    ports:
      - "${LITEBOOKS_PORT:-8000}:8000"
    volumes:
      - attachments:/app/media
      - update_state:/state
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"$${LITEBOOKS_HEALTHCHECK_URL}\" >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Performs the privileged half of an in-app update: the web container runs
  # unprivileged and cannot pull images or restart containers. Remove this
  # service (and set LITEBOOKS_UPDATES_ENABLED=false) to disable UI updates --
  # the Docker socket below is root-equivalent on the host.
  updater:
    image: ghcr.io/litebooks/litebooks-updater:${LITEBOOKS_UPDATER_TAG:-main}
    restart: unless-stopped
    environment:
      LITEBOOKS_COMPOSE_PROJECT: litebooks
      LITEBOOKS_IMAGE: ${LITEBOOKS_UPDATE_IMAGE:-ghcr.io/litebooks/litebooks}
      LITEBOOKS_HEALTH_URL: http://web:8000/healthz/
      LITEBOOKS_POLL_SECONDS: ${LITEBOOKS_UPDATE_POLL_SECONDS:-5}
      LITEBOOKS_HEALTH_TIMEOUT: ${LITEBOOKS_UPDATE_HEALTH_TIMEOUT:-180}
      LITEBOOKS_BACKUP_KEEP: ${LITEBOOKS_UPDATE_BACKUP_KEEP:-5}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./compose.yaml:/repo/compose.yaml:ro
      - ./.env:/repo/.env
      - update_state:/state
    depends_on:
      - web

volumes:
  postgres_data:
  attachments:
  update_state:
