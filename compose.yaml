services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-litebooks}
      POSTGRES_USER: ${POSTGRES_USER:-litebooks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-litebooks} -d ${POSTGRES_DB:-litebooks}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-litebooks}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-litebooks}
    command: >-
      sh -c "python manage.py migrate &&
             gunicorn litebooks.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    ports:
      - "8000:8000"
    volumes:
      - attachments:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  attachments:

