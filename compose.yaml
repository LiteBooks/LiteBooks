services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-litebooks}
      POSTGRES_USER: ${POSTGRES_USER:-litebooks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-litebooks} -d ${POSTGRES_DB:-litebooks}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-America/Los_Angeles}
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-false}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-false}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-0}
      DATABASE_URL: postgresql://${POSTGRES_USER:-litebooks}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-litebooks}
      LITEBOOKS_MANAGE_PY: ${LITEBOOKS_MANAGE_PY:-manage.py}
      LITEBOOKS_WAIT_FOR_DB: ${LITEBOOKS_WAIT_FOR_DB:-true}
      LITEBOOKS_AUTO_MIGRATE: ${LITEBOOKS_AUTO_MIGRATE:-true}
      LITEBOOKS_COLLECT_STATIC: ${LITEBOOKS_COLLECT_STATIC:-false}
      LITEBOOKS_HEALTHCHECK_URL: ${LITEBOOKS_HEALTHCHECK_URL:-http://127.0.0.1:8000/}
    ports:
      - "${LITEBOOKS_PORT:-8000}:8000"
    volumes:
      - attachments:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen(os.environ['LITEBOOKS_HEALTHCHECK_URL'], timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  attachments:
