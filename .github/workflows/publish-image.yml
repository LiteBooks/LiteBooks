name: Publish images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py test
        env:
          DJANGO_SECRET_KEY: test-only-key
          DJANGO_DEBUG: "true"

  publish:
    # Installs update themselves from these images, so a red test must never
    # become a published tag.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record build metadata
        id: meta
        run: |
          # Docker repository names must be lowercase; the org is "LiteBooks".
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "app_image=${{ env.REGISTRY }}/${owner}/litebooks" >> "$GITHUB_OUTPUT"
          echo "updater_image=${{ env.REGISTRY }}/${owner}/litebooks-updater" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push the application image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.app_image }}:main
            ${{ steps.meta.outputs.app_image }}:sha-${{ steps.meta.outputs.short_sha }}
          build-args: |
            LITEBOOKS_GIT_SHA=${{ github.sha }}
            LITEBOOKS_BUILD_TIME=${{ steps.meta.outputs.build_time }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Build and push the updater image
        uses: docker/build-push-action@v6
        with:
          context: ./docker/updater
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.updater_image }}:main
            ${{ steps.meta.outputs.updater_image }}:sha-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=updater
          cache-to: type=gha,scope=updater,mode=max

      - name: Summary
        run: |
          {
            echo "### Published"
            echo "- \`${{ steps.meta.outputs.app_image }}:sha-${{ steps.meta.outputs.short_sha }}\`"
            echo "- \`${{ steps.meta.outputs.updater_image }}:sha-${{ steps.meta.outputs.short_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
